name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  merge_group:

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'merge_group' || vars.ENABLE_AUTO_CI == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
    - name: Run unit tests and coverage
      run: |
        pytest tests/ --cov=src/skeval --cov-report=xml:coverage.xml --cov-report=term-missing --cov-report=term > pytest-coverage.txt 2>&1 || true
        cat pytest-coverage.txt
        pytest tests/ --junitxml=pytest.xml -v --tb=short
    - name: Save PR number for coverage comment
      if: github.event_name == 'pull_request' && matrix.python-version == '3.10'
      run: echo "${{ github.event.pull_request.number }}" > pr_number.txt

    - name: Upload coverage artifacts
      if: github.event_name == 'pull_request' && matrix.python-version == '3.10'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-artifacts
        path: |
          coverage.xml
          pytest.xml
          pytest-coverage.txt
          pr_number.txt
        retention-days: 1

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.10'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: skeval-ai/skeval
        files: ./coverage.xml
        fail_ci_if_error: false

  test-summary:
    name: test
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All matrix tests passed
        run: |
          result="${{ needs.test.result }}"
          if [[ "$result" == "success" ]]; then
            echo "All matrix jobs passed"
          elif [[ "$result" == "skipped" ]]; then
            echo "Tests were skipped (CI not enabled)"
          else
            echo "One or more test matrix jobs failed"
            exit 1
          fi
