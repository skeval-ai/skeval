name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  merge_group:

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'merge_group' || vars.ENABLE_AUTO_CI == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e . || true
    - name: Run unit tests and coverage
      run: |
        pytest tests/ --cov=src/skeval --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=pytest.xml -v --tb=short
    - name: Pytest coverage comment
      if: github.event_name == 'pull_request' && matrix.python-version == '3.10' && github.event.pull_request.head.repo.full_name == github.repository
      uses: MishaKav/pytest-coverage-comment@main
      with:
        pytest-coverage-path: ./coverage.xml
        junitxml-path: ./pytest.xml

  test-summary:
    name: test
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All matrix tests passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more test matrix jobs failed"
            exit 1
          fi
