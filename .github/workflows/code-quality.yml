name: Code Quality

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  merge_group:

jobs:
  lint:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'merge_group' || vars.ENABLE_AUTO_CI == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy
    - name: Check formatting (black)
      run: black --check src/ tests/
    - name: Check import order (isort)
      run: isort --check-only src/ tests/
    - name: Lint (flake8)
      run: flake8 src/ tests/
    - name: Type check (mypy)
      run: mypy src/

    - name: Install extra quality tools
      run: pip install pydocstyle vulture codespell

    - name: Docstring style (pydocstyle)
      run: pydocstyle src/ --config=pyproject.toml

    - name: Dead code detection (vulture)
      run: vulture src/ --min-confidence 80

    - name: Spell check (codespell)
      run: codespell src/ docs/ --skip="*.pyc,*.xml,*.json,*.pt"
