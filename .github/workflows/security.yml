name: Security Scan

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  merge_group:
  schedule:
    - cron: '0 0 * * 0' # Weekly

jobs:
  security-audit:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'schedule' || vars.ENABLE_AUTO_CI == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit pip-licenses
        pip install -e .
    - name: Run Bandit
      run: bandit -r src/ -ll
    - name: Vulnerability Audit (pip-audit)
      # Ignore advisories that currently have no actionable upgrade path in our
      # dependency set; revisit these once upstream publishes fixed releases.
      run: |
        pip-audit --skip-editable \
          --ignore-vuln CVE-2026-3219 \
          --ignore-vuln PYSEC-2024-277 \
          --ignore-vuln PYSEC-2025-189 \
          --ignore-vuln PYSEC-2025-190 \
          --ignore-vuln PYSEC-2025-191 \
          --ignore-vuln PYSEC-2025-192 \
          --ignore-vuln PYSEC-2025-193 \
          --ignore-vuln PYSEC-2025-194 \
          --ignore-vuln PYSEC-2025-195 \
          --ignore-vuln PYSEC-2025-196 \
          --ignore-vuln PYSEC-2025-197 \
          --ignore-vuln PYSEC-2025-210 \
          --ignore-vuln PYSEC-2026-139
    - name: License Compliance Check
      run: pip-licenses --format=markdown > licenses.md
